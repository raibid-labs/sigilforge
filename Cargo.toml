[workspace]
resolver = "2"
members = [
    "sigilforge-core",
    "sigilforge-daemon",
    "sigilforge-cli",
    "sigilforge-client",
    "sigilforge-tui",
    "scarab-sigilforge",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["raibid-labs"]
repository = "https://github.com/raibid-labs/sigilforge"

[workspace.dependencies]
# Internal crates
sigilforge-core = { path = "sigilforge-core" }

# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Configuration
toml = "0.8"
directories = "5.0"

# Secret storage
#
# keyring 3.x ships NO credential store in its default features - it falls back
# to an in-process mock that "succeeds" on write and is empty in the next
# process. A platform backend has to be selected explicitly. These features are
# target-gated inside the keyring crate, so naming all three is correct.
keyring = { version = "3", features = [
    "sync-secret-service", # Linux/BSD: Secret Service over D-Bus
    "crypto-rust",         # pure-Rust crypto for secret-service (no OpenSSL link)
    "apple-native",        # macOS: Keychain
    "windows-native",      # Windows: Credential Manager
] }

# Encrypted file storage (headless hosts with no D-Bus session bus)
#
# `age` is a pure-Rust implementation of the age file-encryption format. It is
# chosen over shelling out to `sops`/`age`/`gpg` because a missing binary on a
# minimal server is exactly the failure mode this backend exists to avoid, and
# over hand-rolled crypto because there is no good reason to hand-roll crypto.
# Default features only: no `cli-common` (which would pull in a passphrase
# prompt), no `plugin`, no `ssh`.
age = { version = "0.12", default-features = false }

# OAuth2
oauth2 = "4.4"

# HTTP client (for OAuth flows)
reqwest = { version = "0.12", features = ["json"] }

# URL handling
url = "2.5"

# RSA signing (RS256 JWTs for GitHub App authentication)
rsa = { version = "0.9", features = ["sha2"] }

# base64url encoding (JWT segments)
base64 = "0.22"

# Unique identifiers
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# JSON-RPC
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }

# Testing
tempfile = "3.13"

# Synchronization primitives
parking_lot = "0.12"

# Memory zeroing for secrets
zeroize = { version = "1.8", features = ["zeroize_derive"] }
